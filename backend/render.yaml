# Render.com Blueprint — deploy API as a Web Service
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
